
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EQUALITY - All Are Equal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.45)),
                url("image/Golden Equality Circle (1).png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .content {
            width: 90%;
            max-width: 850px;
            padding: 30px 15px;
        }

        h1 {
            font-size: clamp(45px, 9vw, 85px);
            color: #FFD700;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #D4AF37;
            margin-bottom: 20px;
        }

        h2 {
            font-size: clamp(24px, 5vw, 42px);
            color: #FFD700;
            letter-spacing: 3px;
            margin-bottom: 20px;

            text-shadow:
                0 0 5px #FFD700,
                0 0 15px #B8860B,
                0 0 25px #DAA520;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #FFE7A0;
            margin-bottom: 35px;

            text-shadow:
                0 0 5px #B8860B,
                0 0 12px rgba(255, 215, 0, 0.5);
        }

        .join-btn {
            background: linear-gradient(
                135deg,
                #FFD700,
                #B8860B
            );

            color: black;
            padding: 18px 30px;
            border: 2px solid #FFE58A;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .join-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #FFD700;
        }

        .footer {
            margin-top: 35px;
            color: #FFD700;
            font-size: 14px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #DAA520;
        }

        @media (max-width: 600px) {

            .content {
                padding: 20px 10px;
            }

            h1 {
                letter-spacing: 4px;
            }

            h2 {
                letter-spacing: 2px;
            }

            p {
                font-size: 16px;
            }

            .join-btn {
                padding: 15px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="content">

        <h1>EQUALITY</h1>

        <h2>WE ARE ALL EQUAL</h2><br><br><br>

        <p><br><br>
            Everyone deserves equal rights,
            respect, and opportunities.
            <br>
            Different People. One Humanity.
        </p>

        <button class="join-btn"
            onclick="window.location.href='register.html'">

            I BELIEVE WE ARE ALL EQUAL

        </button>

        <div class="footer">
            ONE HUMANITY • EQUAL RESPECT
        </div>

    </div>
<script type="module" src="firebase.js"></script>
</body>
</html>
